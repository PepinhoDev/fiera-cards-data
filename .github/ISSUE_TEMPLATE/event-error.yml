name: Event error
description: Wrong dates, place or link, or an event that was cancelled or moved
title: "Event error: "
labels: ["event-error"]
body:
  - type: input
    id: event
    attributes:
      label: Event (name or id)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source confirming the correction (https://…)
