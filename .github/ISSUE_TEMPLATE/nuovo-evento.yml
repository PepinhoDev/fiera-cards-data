name: Nuovo evento
description: Segnala una fiera, un mercatino o un torneo di carte da aggiungere
title: "Nuovo evento: "
labels: ["nuovo-evento"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie! Ogni evento viene controllato a mano sul sito ufficiale prima di essere pubblicato.
        Non inserire dati personali.
  - type: input
    id: name
    attributes:
      label: Nome dell'evento
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Date (inizio e fine)
      placeholder: "es. 28/10/2026 – 01/11/2026"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Luogo (sede e città)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Sito ufficiale (https://…)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Note (facoltative)
      description: Ci sono un'area carte, un mercatino o dei tornei di Magic?
