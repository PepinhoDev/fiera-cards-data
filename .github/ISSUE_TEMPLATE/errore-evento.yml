name: Errore in un evento
description: Date, luogo o link sbagliati, evento annullato o spostato
title: "Errore evento: "
labels: ["errore"]
body:
  - type: input
    id: event
    attributes:
      label: Evento (nome o id)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Cosa non è corretto?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Fonte che conferma la correzione (https://…)
