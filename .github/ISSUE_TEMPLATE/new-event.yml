name: New event
description: Suggest a card fair, market or tournament to add
title: "New event: "
labels: ["new-event"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Every event is checked by hand against the official website before it is published.
        Please do not include personal data.
  - type: input
    id: name
    attributes:
      label: Event name
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Dates (start and end)
      placeholder: "e.g. 2026-10-28 to 2026-11-01"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Place (venue and city)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official website (https://…)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Is there a card area, a card market or Magic tournaments?
